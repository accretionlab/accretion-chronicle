<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128" shape-rendering="crispEdges">
  <!-- 혜윰 16x16 레트로 픽셀 애니메이션 v2 (본체 크기 불변 고정 + 코어 섬광 & 비트 공전 & 방전 스파크) -->
  <style>
    .f1, .f2, .f3, .f4 { display: none; }
    .f1 { animation: showF1 0.8s infinite steps(1); }
    .f2 { animation: showF2 0.8s infinite steps(1); }
    .f3 { animation: showF3 0.8s infinite steps(1); }
    .f4 { animation: showF4 0.8s infinite steps(1); }

    @keyframes showF1 { 0%, 100% { display: inline; } 25%, 99.9% { display: none; } }
    @keyframes showF2 { 25% { display: inline; } 0%, 24.9%, 50%, 100% { display: none; } }
    @keyframes showF3 { 50% { display: inline; } 0%, 49.9%, 75%, 100% { display: none; } }
    @keyframes showF4 { 75% { display: inline; } 0%, 74.9%, 99.9% { display: none; } }
  </style>

  <!-- ======================================================== -->
  <!-- FRAME 1: 충전 / 축적 (비트: 12시/3시/6시/9시, 코어 골드)    -->
  <!-- ======================================================== -->
  <g class="f1" id="frame1">
    <!-- 정찰 비트 4점 (십자 위치) -->
    <rect x="8" y="1" width="1" height="1" fill="#38bdf8" />
    <rect x="13" y="7" width="1" height="1" fill="#0284c7" />
    <rect x="7" y="14" width="1" height="1" fill="#0284c7" />
    <rect x="2" y="7" width="1" height="1" fill="#38bdf8" />

    <!-- 번개 본체 (크기 고정 정본: 골드/앰버 코어) -->
    <rect x="9" y="2" width="1" height="1" fill="#facc15" />
    <rect x="8" y="3" width="1" height="1" fill="#facc15" />
    <rect x="9" y="3" width="1" height="1" fill="#f59e0b" />
    <rect x="7" y="4" width="1" height="1" fill="#facc15" />
    <rect x="8" y="4" width="1" height="1" fill="#f59e0b" />
    <rect x="6" y="5" width="1" height="1" fill="#facc15" />
    <rect x="7" y="5" width="1" height="1" fill="#f59e0b" />
    <!-- 가로 절단 꺾임 -->
    <rect x="4" y="6" width="7" height="1" fill="#facc15" />
    <rect x="5" y="6" width="3" height="1" fill="#fef08a" />
    <rect x="5" y="7" width="5" height="1" fill="#f59e0b" />
    <!-- 하향 꼬리 -->
    <rect x="8" y="8" width="2" height="1" fill="#facc15" />
    <rect x="7" y="9" width="2" height="1" fill="#facc15" />
    <rect x="6" y="10" width="2" height="1" fill="#f59e0b" />
    <rect x="5" y="11" width="2" height="1" fill="#f59e0b" />
    <rect x="4" y="12" width="2" height="1" fill="#d97706" />
    <rect x="4" y="13" width="1" height="1" fill="#d97706" />
  </g>

  <!-- ======================================================== -->
  <!-- FRAME 2: 섬광 번뜩임! (본체 크기 불변! 코어 순백 플래시 + 외곽 십자 빛살 팟!) -->
  <!-- ======================================================== -->
  <g class="f2" id="frame2">
    <!-- 정찰 비트 4점 (45도 대각선 공전) -->
    <rect x="12" y="3" width="1" height="1" fill="#e0f2fe" />
    <rect x="12" y="11" width="1" height="1" fill="#38bdf8" />
    <rect x="3" y="11" width="1" height="1" fill="#38bdf8" />
    <rect x="3" y="3" width="1" height="1" fill="#e0f2fe" />

    <!-- 외곽 십자 픽셀 빛살 (1px 스파크 광선: 본체에 닿지 않고 1px 떨어진 빛) -->
    <rect x="8" y="0" width="1" height="1" fill="#ffffff" />
    <rect x="14" y="6" width="1" height="1" fill="#ffffff" />
    <rect x="8" y="15" width="1" height="1" fill="#ffffff" />
    <rect x="1" y="6" width="1" height="1" fill="#ffffff" />

    <!-- 번개 본체 (완벽히 동일한 실루엣, 중심 핵만 순백 #ffffff 폭발!) -->
    <rect x="9" y="2" width="1" height="1" fill="#ffffff" />
    <rect x="8" y="3" width="1" height="1" fill="#fef08a" />
    <rect x="9" y="3" width="1" height="1" fill="#ffffff" />
    <rect x="7" y="4" width="1" height="1" fill="#fef08a" />
    <rect x="8" y="4" width="1" height="1" fill="#ffffff" />
    <rect x="6" y="5" width="1" height="1" fill="#fef08a" />
    <rect x="7" y="5" width="1" height="1" fill="#ffffff" />
    <!-- 가로 절단 꺾임 (순백 플래시 핵) -->
    <rect x="4" y="6" width="7" height="1" fill="#fef08a" />
    <rect x="5" y="6" width="5" height="1" fill="#ffffff" />
    <rect x="5" y="7" width="5" height="1" fill="#ffffff" />
    <!-- 하향 꼬리 -->
    <rect x="8" y="8" width="2" height="1" fill="#ffffff" />
    <rect x="7" y="9" width="2" height="1" fill="#ffffff" />
    <rect x="6" y="10" width="2" height="1" fill="#fef08a" />
    <rect x="5" y="11" width="2" height="1" fill="#fef08a" />
    <rect x="4" y="12" width="2" height="1" fill="#facc15" />
    <rect x="4" y="13" width="1" height="1" fill="#facc15" />
  </g>

  <!-- ======================================================== -->
  <!-- FRAME 3: 방전 스파크 (본체 크기 불변, 꼬리 끝 스파크 분리 낙하) -->
  <!-- ======================================================== -->
  <g class="f3" id="frame3">
    <!-- 정찰 비트 4점 (공전 3단계) -->
    <rect x="11" y="2" width="1" height="1" fill="#38bdf8" />
    <rect x="13" y="9" width="1" height="1" fill="#0284c7" />
    <rect x="5" y="13" width="1" height="1" fill="#0284c7" />
    <rect x="2" y="5" width="1" height="1" fill="#38bdf8" />

    <!-- 꼬리 끝단에서 1px 스파크 분리 팟! -->
    <rect x="3" y="14" width="1" height="1" fill="#fef08a" />
    <rect x="4" y="15" width="1" height="1" fill="#facc15" />

    <!-- 번개 본체 (완벽히 동일한 실루엣, 골드 핵으로 복귀) -->
    <rect x="9" y="2" width="1" height="1" fill="#fef08a" />
    <rect x="8" y="3" width="1" height="1" fill="#facc15" />
    <rect x="9" y="3" width="1" height="1" fill="#fef08a" />
    <rect x="7" y="4" width="1" height="1" fill="#facc15" />
    <rect x="8" y="4" width="1" height="1" fill="#fef08a" />
    <rect x="6" y="5" width="1" height="1" fill="#facc15" />
    <rect x="7" y="5" width="1" height="1" fill="#fef08a" />
    <!-- 가로 절단 꺾임 -->
    <rect x="4" y="6" width="7" height="1" fill="#facc15" />
    <rect x="6" y="6" width="2" height="1" fill="#ffffff" />
    <rect x="5" y="7" width="5" height="1" fill="#f59e0b" />
    <!-- 하향 꼬리 -->
    <rect x="8" y="8" width="2" height="1" fill="#facc15" />
    <rect x="7" y="9" width="2" height="1" fill="#facc15" />
    <rect x="6" y="10" width="2" height="1" fill="#f59e0b" />
    <rect x="5" y="11" width="2" height="1" fill="#f59e0b" />
    <rect x="4" y="12" width="2" height="1" fill="#d97706" />
    <rect x="4" y="13" width="1" height="1" fill="#d97706" />
  </g>

  <!-- ======================================================== -->
  <!-- FRAME 4: 안정 순항 (기본 정본 실루엣 + 1px 순백 핵)           -->
  <!-- ======================================================== -->
  <g class="f4" id="frame4">
    <!-- 정찰 비트 4점 (기본 마름모 위치) -->
    <rect x="2" y="4" width="1" height="1" fill="#38bdf8" />
    <rect x="13" y="3" width="1" height="1" fill="#0284c7" />
    <rect x="3" y="12" width="1" height="1" fill="#0284c7" />
    <rect x="13" y="11" width="1" height="1" fill="#38bdf8" />

    <!-- 번개 본체 (완벽히 동일한 실루엣) -->
    <rect x="9" y="1" width="1" height="1" fill="#fef08a" />
    <rect x="8" y="2" width="1" height="1" fill="#facc15" />
    <rect x="9" y="2" width="1" height="1" fill="#ffffff" />
    <rect x="7" y="3" width="1" height="1" fill="#facc15" />
    <rect x="8" y="3" width="1" height="1" fill="#ffffff" />
    <rect x="6" y="4" width="1" height="1" fill="#facc15" />
    <rect x="7" y="4" width="1" height="1" fill="#ffffff" />
    <rect x="5" y="5" width="1" height="1" fill="#facc15" />
    <rect x="6" y="5" width="1" height="1" fill="#ffffff" />
    <!-- 가로 절단 꺾임 -->
    <rect x="4" y="6" width="7" height="1" fill="#facc15" />
    <rect x="5" y="6" width="2" height="1" fill="#ffffff" />
    <rect x="5" y="7" width="4" height="1" fill="#f59e0b" />
    <!-- 하향 꼬리 -->
    <rect x="8" y="8" width="1" height="1" fill="#facc15" />
    <rect x="9" y="8" width="1" height="1" fill="#ffffff" />
    <rect x="7" y="9" width="1" height="1" fill="#facc15" />
    <rect x="8" y="9" width="1" height="1" fill="#ffffff" />
    <rect x="6" y="10" width="2" height="1" fill="#f59e0b" />
    <rect x="5" y="11" width="2" height="1" fill="#f59e0b" />
    <rect x="4" y="12" width="2" height="1" fill="#d97706" />
    <rect x="4" y="13" width="1" height="1" fill="#d97706" />
  </g>
</svg>
