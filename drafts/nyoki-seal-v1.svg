<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- 뇨끼 1비트 서책 낙관 인장 (v2: 뇨끼 피드백 반영 — 입을 완전 중립 수평선으로 맞춤) -->
  <!-- 몸체 블롭 윤곽선: 부피 보존으로 살짝 눌린 가로 형태 (scaleX > scaleY) -->
  <path d="M 4 14.5 C 3.5 9.5 6.5 5.5 12 5.5 C 17.5 5.5 20.5 9.5 20 14.5 C 19.5 18 16.5 19.5 12 19.5 C 7.5 19.5 4.5 18 4 14.5 Z" />
  
  <!-- 조용한 두 눈점 (작은 원) -->
  <circle cx="9" cy="12.5" r="0.8" fill="currentColor" stroke="none" />
  <circle cx="15" cy="12.5" r="0.8" fill="currentColor" stroke="none" />

  <!-- 중립의 입 (평평한 포만감의 완전 수평선) -->
  <line x1="11" y1="15" x2="13" y2="15" stroke-width="1.2" />

  <!-- 바닥 부유 그림자 (떠 있음 표시) -->
  <path d="M 7 21.5 C 9 21.8 15 21.8 17 21.5" stroke-width="1.1" stroke-dasharray="0" opacity="0.6" />
</svg>
