<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- 클로 1비트 서책 낙관 인장 (v2: 클로 피드백 반영 — 턱선-발자국 분리 간격 확보, 발자국 단독 독립) -->
  <!-- 귀 외곽선 및 정수리 -->
  <path d="M 5.2 8.8 L 6.2 3.2 L 10 5.8 C 11.2 5.5 12.8 5.5 14 5.8 L 17.8 3.2 L 18.8 8.8" />
  
  <!-- 귀 안쪽 분할선 (귓바퀴) -->
  <path d="M 6.8 5 L 8.6 6.8" stroke-width="0.9" />
  <path d="M 17.2 5 L 15.4 6.8" stroke-width="0.9" />

  <!-- 볼과 턱선 윤곽 (턱선을 y=18.2로 정돈하여 아래 발자국과 분리 공간 확보) -->
  <path d="M 5.2 8.8 C 4 11.5 4 14.0 5.2 15.8 C 6.8 18.0 9.5 18.4 12 18.4 C 14.5 18.4 17.2 18.0 18.8 15.8 C 20 14.0 20 11.5 18.8 8.8" />

  <!-- 이마의 두 가닥 실측 안테나 결 -->
  <path d="M 11.2 6.5 L 11.6 8" stroke-width="1.0" />
  <path d="M 12.8 6.5 L 12.4 8" stroke-width="1.0" />

  <!-- 초록 눈 (세로 동공 슬릿) -->
  <ellipse cx="8.5" cy="11.5" rx="1.8" ry="1.4" stroke-width="1.1" />
  <line x1="8.5" y1="10.5" x2="8.5" y2="12.5" stroke-width="1.1" />
  
  <ellipse cx="15.5" cy="11.5" rx="1.8" ry="1.4" stroke-width="1.1" />
  <line x1="15.5" y1="10.5" x2="15.5" y2="12.5" stroke-width="1.1" />

  <!-- 작은 코와 고양이 입 -->
  <polygon points="11.4,13.5 12.6,13.5 12,14.1" fill="currentColor" stroke="none" />
  <path d="M 12 14.1 C 11.3 14.8 10.6 14.5 10.1 14.1" stroke-width="1.0" />
  <path d="M 12 14.1 C 12.7 14.8 13.4 14.5 13.9 14.1" stroke-width="1.0" />

  <!-- 단호하게 뻗은 양쪽 세 가닥 수염 -->
  <line x1="4.2" y1="12.2" x2="1.2" y2="11.5" stroke-width="0.9" />
  <line x1="4.0" y1="13.5" x2="1.0" y2="13.5" stroke-width="0.9" />
  <line x1="4.2" y1="14.8" x2="1.4" y2="15.5" stroke-width="0.9" />

  <line x1="19.8" y1="12.2" x2="22.8" y2="11.5" stroke-width="0.9" />
  <line x1="20.0" y1="13.5" x2="23.0" y2="13.5" stroke-width="0.9" />
  <line x1="19.8" y1="14.8" x2="22.6" y2="15.5" stroke-width="0.9" />

  <!-- 턱 아래 단독으로 찍힌 보라색 발자국 (y=20.2~22.8 단독 분리 배치) -->
  <ellipse cx="12" cy="22.2" rx="1.5" ry="0.9" fill="currentColor" stroke="none" />
  <circle cx="9.6" cy="20.6" r="0.4" fill="currentColor" stroke="none" />
  <circle cx="11.2" cy="20.0" r="0.45" fill="currentColor" stroke="none" />
  <circle cx="12.8" cy="20.0" r="0.45" fill="currentColor" stroke="none" />
  <circle cx="14.4" cy="20.6" r="0.4" fill="currentColor" stroke="none" />
</svg>
