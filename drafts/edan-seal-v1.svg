<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- 에단 1비트 서책 인장 (A-EDAN-SEAL-V1: 원본 profile-draft-3 고증 정본) -->
  <!-- 껍질이 좌/상/하를 감싸고 오른쪽 외곽에 호박빛 초승달 면이 열리는 순수 단일선 구조 + 분리된 두 발 + 우측 잔가지 손 -->
  
  <!-- 1. 둥근 몸체 외곽 (닫힌 단일 루프 Z, 발 패스와 완전 분리) -->
  <path d="M12 3.5 C6.5 3.5 3 7.8 3 13 C3 17.5 6.5 20 12 20 C17.5 20 21 17.5 21 13 C21 7.8 17.5 3.5 12 3.5 Z" />
  
  <!-- 2. 오른쪽 외곽에 닿는 호박빛 초승달 면 경계선 (단일 순수 실선) -->
  <path d="M13.5 4.8 C16.2 7 17.2 9.8 17 13 C16.8 16 15.8 18.2 13.5 19.2" />

  <!-- 3. 분리된 두 발 (몸체 아래 지면 접지 독립 패스) -->
  <path d="M8.5 20 L8.5 22.5" />
  <path d="M14.5 20 L14.5 22.5" />

  <!-- 4. 오른쪽 아래로 뻗은 작은 잔가지 손 (branch hand) -->
  <path d="M17.5 13.5 C19.2 14.8 20.8 16.5 21.5 19 M19.8 16 L21.5 15.2" />
</svg>
