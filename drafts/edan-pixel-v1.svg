<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128" shape-rendering="crispEdges">
  <!-- 에단 픽셀 스프라이트 v2 (16x16 레트로 도트: 원본 profile-draft-3 고증) -->
  <!-- 껍질(#1e293b, #334155, #475569)이 좌/상/하를 감싸고, 오른쪽 외곽에 호박빛 초승달(#fef3c7, #f59e0b, #d97706)이 직접 닿는 구조 -->
  
  <!-- y=3 : 둥근 몸체 상단 -->
  <rect x="5" y="3" width="5" height="1" fill="#1e293b" />
  
  <!-- y=4 -->
  <rect x="3" y="4" width="2" height="1" fill="#1e293b" />
  <rect x="5" y="4" width="4" height="1" fill="#334155" />
  <rect x="9" y="4" width="2" height="1" fill="#1e293b" />
  <rect x="11" y="4" width="1" height="1" fill="#d97706" />

  <!-- y=5 -->
  <rect x="2" y="5" width="1" height="1" fill="#1e293b" />
  <rect x="3" y="5" width="2" height="1" fill="#334155" />
  <rect x="5" y="5" width="3" height="1" fill="#475569" />
  <rect x="8" y="5" width="2" height="1" fill="#334155" />
  <rect x="10" y="5" width="1" height="1" fill="#f59e0b" />
  <rect x="11" y="5" width="1" height="1" fill="#fef3c7" />
  <rect x="12" y="5" width="1" height="1" fill="#d97706" />

  <!-- y=6 -->
  <rect x="2" y="6" width="1" height="1" fill="#1e293b" />
  <rect x="3" y="6" width="2" height="1" fill="#334155" />
  <rect x="5" y="6" width="3" height="1" fill="#475569" />
  <rect x="8" y="6" width="1" height="1" fill="#334155" />
  <rect x="9" y="6" width="1" height="1" fill="#f59e0b" />
  <rect x="10" y="6" width="2" height="1" fill="#fef3c7" />
  <rect x="12" y="6" width="1" height="1" fill="#f59e0b" />

  <!-- y=7 : 오른쪽 외곽으로 활짝 열린 호박빛 초승달 -->
  <rect x="2" y="7" width="1" height="1" fill="#1e293b" />
  <rect x="3" y="7" width="2" height="1" fill="#334155" />
  <rect x="5" y="7" width="2" height="1" fill="#475569" />
  <rect x="7" y="7" width="2" height="1" fill="#334155" />
  <rect x="9" y="7" width="1" height="1" fill="#d97706" />
  <rect x="10" y="7" width="2" height="1" fill="#fef3c7" />
  <rect x="12" y="7" width="1" height="1" fill="#f59e0b" />

  <!-- y=8 -->
  <rect x="2" y="8" width="1" height="1" fill="#1e293b" />
  <rect x="3" y="8" width="2" height="1" fill="#334155" />
  <rect x="5" y="8" width="2" height="1" fill="#475569" />
  <rect x="7" y="8" width="2" height="1" fill="#334155" />
  <rect x="9" y="8" width="1" height="1" fill="#d97706" />
  <rect x="10" y="8" width="2" height="1" fill="#fef3c7" />
  <rect x="12" y="8" width="1" height="1" fill="#f59e0b" />

  <!-- y=9 -->
  <rect x="2" y="9" width="1" height="1" fill="#1e293b" />
  <rect x="3" y="9" width="2" height="1" fill="#334155" />
  <rect x="5" y="9" width="3" height="1" fill="#475569" />
  <rect x="8" y="9" width="1" height="1" fill="#334155" />
  <rect x="9" y="9" width="1" height="1" fill="#f59e0b" />
  <rect x="10" y="9" width="2" height="1" fill="#fef3c7" />
  <rect x="12" y="9" width="1" height="1" fill="#d97706" />

  <!-- y=10 -->
  <rect x="2" y="10" width="1" height="1" fill="#1e293b" />
  <rect x="3" y="10" width="2" height="1" fill="#334155" />
  <rect x="5" y="10" width="3" height="1" fill="#334155" />
  <rect x="8" y="10" width="2" height="1" fill="#1e293b" />
  <rect x="10" y="10" width="1" height="1" fill="#f59e0b" />
  <rect x="11" y="10" width="1" height="1" fill="#d97706" />
  <!-- 우측 잔가지 시작 -->
  <rect x="13" y="10" width="1" height="1" fill="#1e293b" />

  <!-- y=11 -->
  <rect x="3" y="11" width="2" height="1" fill="#1e293b" />
  <rect x="5" y="11" width="4" height="1" fill="#334155" />
  <rect x="9" y="11" width="2" height="1" fill="#1e293b" />
  <rect x="11" y="11" width="1" height="1" fill="#d97706" />
  <!-- 잔가지 손 뻗음 -->
  <rect x="13" y="11" width="2" height="1" fill="#334155" />

  <!-- y=12 : 몸체 하단 닫힘 -->
  <rect x="4" y="12" width="6" height="1" fill="#1e293b" />
  <rect x="14" y="12" width="1" height="1" fill="#1e293b" />

  <!-- y=13~14 : 분리된 두 발/뿌리 (바닥 접지) -->
  <rect x="5" y="13" width="2" height="1" fill="#334155" />
  <rect x="8" y="13" width="2" height="1" fill="#334155" />
  <rect x="4" y="14" width="3" height="1" fill="#1e293b" />
  <rect x="8" y="14" width="3" height="1" fill="#1e293b" />
</svg>
