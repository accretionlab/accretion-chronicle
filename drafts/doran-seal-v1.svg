<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- 도란 1비트 서책 낙관 인장 (v2: 도란 피드백 반영 — 잎사귀 탈피, 맨 깃대 노출, 비대칭 깃, V자 홈) -->
  <!-- 서고 등불의 은은한 원호 가이드 -->
  <path d="M 11 3.5 C 16 3.5 20 7.5 20.5 12.5 C 20.8 15.5 19.5 18 17.5 19.5" stroke-width="0.8" stroke-dasharray="1.5 2" opacity="0.4" />

  <!-- 깃대 중심축 (shaft): 펜촉부터 깃털 끝까지 관통 -->
  <line x1="5.5" y1="18.5" x2="19.5" y2="4.5" stroke-width="1.3" />

  <!-- 펜촉 위 노출된 맨 깃대 (깃 없는 구간: (5.5,18.5) -> (9.5,14.5)) -->

  <!-- 상단 넓은 깃 (외경: V자 홈 2개 포함) -->
  <path d="M 9.5 14.5 C 9.5 10.5 12.5 6.5 19.5 4.5" stroke-width="1.1" />
  <!-- 상단 V자 갈라짐 홈 1, 2 -->
  <path d="M 12.5 11.2 L 13.8 11.6 L 14.2 10.2" stroke-width="1.0" />
  <path d="M 15.5 8.2 L 16.8 8.6 L 17.2 7.2" stroke-width="1.0" />

  <!-- 하단 좁은 깃 (내경: 깃대에 더 붙어 있는 비대칭 깃) -->
  <path d="M 11 15 C 13.5 14.5 16.5 12 19.5 4.5" stroke-width="1.1" />
  <!-- 하단 V자 갈라짐 홈 1 -->
  <path d="M 14.5 13.2 L 15.6 12.5 L 15.2 13.8" stroke-width="1.0" />

  <!-- 황금 펜촉 (nib): 좌하단에서 지면을 찌르는 단호한 펜촉 -->
  <path d="M 3.8 20.2 L 6.2 17.8 L 7.5 19.2 L 5.2 21.5 Z" fill="none" stroke-width="1.2" />

  <!-- 펜촉 잉크 슬릿과 숨구멍 -->
  <line x1="3.8" y1="20.2" x2="5.5" y2="18.5" stroke-width="1.0" />
  <circle cx="5.8" cy="18.2" r="0.45" fill="currentColor" stroke="none" />
</svg>
